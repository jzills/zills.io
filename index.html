    <script>
      // Picks the hero's still before the first paint: one of four broken frames of the
      // Lab's Banded Capsule, taking turns between visits (see .hero-art in src/index.css).
      (function () {
        var count = 4
        var n = 1 + Math.floor(Math.random() * count)
        try {
          var last = parseInt(localStorage.getItem('hero-art'), 10)
          if (last >= 1 && last <= count) n = (last % count) + 1
          localStorage.setItem('hero-art', String(n))
        } catch (e) {}
        document.documentElement.dataset.hero = String(n)
      })()
    </script>
