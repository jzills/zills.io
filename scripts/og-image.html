<!doctype html>
<!-- The link-preview image. Regenerate public/og-image.png with a headless browser at
     1200×630, e.g. chrome-headless-shell --window-size=1200,630 --screenshot=public/og-image.png file://$PWD/scripts/og-image.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #09090b; color: #fafafa; font-family: Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  body::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 70% 0%, rgb(34 211 238 / .12), transparent 70%),
      repeating-linear-gradient(-60deg, rgb(255 255 255 / .03) 0 1px, transparent 1px 46px); }
  h1 { position: relative; font-weight: 800; font-size: 190px; letter-spacing: -0.03em; line-height: .9; }
  h1 span { font-weight: 600; color: rgb(250 250 250 / .55); }
  p { position: relative; margin-top: 24px; font-size: 30px; color: #8b8b94; font-weight: 500; }
  .dots { position: absolute; bottom: 48px; display: flex; gap: 14px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; }
</style></head>
<body>
  <h1>Z<span>/</span>LLS</h1>
  <p>Somewhere between the signal and the noise.</p>
  <div class="dots"><i style="background:#22d3ee"></i><i style="background:#fbbf24"></i><i style="background:#fb923c"></i><i style="background:#a78bfa"></i></div>
</body></html>
